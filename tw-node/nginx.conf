# Termux Nginx 設定（Android 台灣節點）
# 啟動：nginx -c ~/tw-node/nginx.conf

worker_processes 1;
error_log /data/data/com.termux/files/home/tw-node/error.log warn;
pid /data/data/com.termux/files/home/tw-node/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /data/data/com.termux/files/usr/etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /data/data/com.termux/files/home/tw-node/access.log;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 12m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # HTTP → HTTPS（路由器把 80 轉到 8080）
    server {
        listen 8080;
        server_name tw.bx2aov.top;
        return 301 https://$host$request_uri;
    }

    server {
        listen 8443 ssl;
        server_name tw.bx2aov.top;

        ssl_certificate     /data/data/com.termux/files/home/tw-node/cert.pem;
        ssl_certificate_key /data/data/com.termux/files/home/tw-node/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        root /data/data/com.termux/files/home/site;
        index index.html;

        # 把 Supabase 絕對網址改成本站相對路徑：
        #   https://xxx.supabase.co/rest/v1/... → /rest/v1/...
        # 這樣瀏覽器只會連到這台手機，再由手機代理到 Supabase。
        sub_filter_types text/html application/javascript application/json;
        sub_filter 'https://btcsstbtbnejuyexwbpn.supabase.co' '';
        sub_filter_once off;

        location / {
            try_files $uri $uri/ =404;
        }

        location ~* \.(css|js|png|jpe?g|svg|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public";
        }

        # ---- Supabase 反向代理 ----
        location /rest/ {
            proxy_pass https://btcsstbtbnejuyexwbpn.supabase.co/rest/;
            proxy_set_header Host btcsstbtbnejuyexwbpn.supabase.co;
            proxy_set_header Accept-Encoding "";
            proxy_ssl_server_name on;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
        }

        location /auth/ {
            proxy_pass https://btcsstbtbnejuyexwbpn.supabase.co/auth/;
            proxy_set_header Host btcsstbtbnejuyexwbpn.supabase.co;
            proxy_set_header Accept-Encoding "";
            proxy_ssl_server_name on;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
        }

        location /storage/ {
            proxy_pass https://btcsstbtbnejuyexwbpn.supabase.co/storage/;
            proxy_set_header Host btcsstbtbnejuyexwbpn.supabase.co;
            proxy_set_header Accept-Encoding "";
            proxy_ssl_server_name on;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 120s;
        }

        location /functions/ {
            proxy_pass https://btcsstbtbnejuyexwbpn.supabase.co/functions/;
            proxy_set_header Host btcsstbtbnejuyexwbpn.supabase.co;
            proxy_set_header Accept-Encoding "";
            proxy_ssl_server_name on;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 120s;
        }
    }
}
