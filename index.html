<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BX2AOV QSL confirm</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="app-container">
        <header class="header-bar">
            <div class="logo-area">
                <span class="logo-icon">📡</span>
                <span>BX2AOV QSL confirm</span>
                <span class="callsign-badge">BX2AOV</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-tab active">總覽</a></li>
                <li><a href="apply.html" class="nav-tab">我的申請</a></li>
                <li><a href="manage.html" class="nav-tab">管理員</a></li>
            </ul>
            <div id="loginStatus" style="font-size:0.9rem; color:#2b4056;">
                <span class="role-badge">訪客</span>
            </div>
        </header>

        <section class="card">
            <h2>📋 通聯紀錄與 QSL 狀態</h2>
            <div class="card-sub">點擊縮圖可放大檢視 QSL 卡圖片。表格時間均為 <b>UTC 世界標準時間</b>。</div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <!-- 這裡把時間表頭加上 (UTC) -->
                            <th>日期 (UTC)</th><th>時間 (UTC)</th><th>呼號</th><th>頻段</th><th>模式</th>
                            <th>收到 QSL</th><th>發出 QSL</th><th>狀態</th><th>備註</th>
                        </tr>
                    </thead>
                    <tbody id="qsoTableBody">
                        <tr><td colspan="9"><div class="empty-state">⏳ 資料載入中...</div></td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <div class="lightbox" id="lightbox">
        <span class="lightbox-close" id="lightboxClose">×</span>
        <img id="lightboxImg" src="" alt="QSL 卡大圖">
    </div>

    <div id="toast" class="toast">操作成功</div>

    <script src="script.js"></script>
</body>
</html>
