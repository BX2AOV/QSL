<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BX2AOV QSL confirm</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="app-container">
        <header class="header-bar">
            <div class="logo-area">
                <span class="logo-icon">📡</span>
                <span>BX2AOV QSL confirm</span>
                <span class="callsign-badge">BX2AOV</span>
            </div>
            
            <ul class="nav-links">
                <li><a href="index.html" class="nav-tab active" data-zh="總覽" data-en="Overview">總覽</a></li>
                <li><a href="apply.html" class="nav-tab" data-zh="我的申請" data-en="My Requests">我的申請</a></li>
                <li><a href="manage.html" class="nav-tab" data-zh="管理員" data-en="Admin">管理員</a></li>
            </ul>
            
            <div style="display: flex; align-items: center; gap: 16px;">
                <!-- 👇 新的滑動開關 👇 -->
                <div class="lang-switch" id="langToggle" title="切換語言 / Switch Language">
                    <div class="lang-slider"></div>
                    <span class="lang-option" data-lang="zh">中文</span>
                    <span class="lang-option" data-lang="en">EN</span>
                </div>
                <!-- 👆 新的滑動開關 👆 -->

                <div id="loginStatus" style="font-size:0.9rem; color:#2b4056;">
                    <span class="role-badge" data-zh="訪客" data-en="Guest">訪客</span>
                </div>
            </div>
        </header>

        <section class="card">
            <h2 data-zh="📋 通聯紀錄與 QSL 狀態" data-en="📋 QSO Logs & QSL Status">📋 通聯紀錄與 QSL 狀態</h2>
            <div class="card-sub" data-zh="點擊縮圖可放大檢視 QSL 卡圖片。表格時間均為 UTC 世界標準時間。" data-en="Click on thumbnails to enlarge QSL images. All times in the table are UTC.">點擊縮圖可放大檢視 QSL 卡圖片。表格時間均為 UTC 世界標準時間。</div>
            
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th data-zh="日期" data-en="Date">日期</th>
                            <th data-zh="時間 (UTC)" data-en="Time (UTC)">時間 (UTC)</th>
                            <th data-zh="呼號" data-en="Callsign">呼號</th>
                            <th data-zh="頻段" data-en="Band">頻段</th>
                            <th data-zh="模式" data-en="Mode">模式</th>
                            <th data-zh="收到 QSL" data-en="Rcvd QSL">收到 QSL</th>
                            <th data-zh="發出 QSL" data-en="Sent QSL">發出 QSL</th>
                            <th data-zh="狀態" data-en="Status">狀態</th>
                            <th data-zh="備註" data-en="Notes">備註</th>
                        </tr>
                    </thead>
                    <tbody id="qsoTableBody">
                        <tr><td colspan="9"><div class="empty-state" data-zh="⏳ 資料載入中..." data-en="⏳ Loading data...">⏳ 資料載入中...</div></td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <div class="lightbox" id="lightbox">
        <span class="lightbox-close" id="lightboxClose">×</span>
        <img id="lightboxImg" src="" alt="QSL 卡大圖">
    </div>

    <div id="toast" class="toast">操作成功</div>

    <script src="script.js"></script>
</body>
</html>
