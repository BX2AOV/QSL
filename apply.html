<!-- 找到這一段並替換 -->
<div class="row-group">
    <div class="form-row" style="flex: 2;">
        <label data-zh="手機號碼" data-cn="手机号码" data-en="Phone" data-ja="電話番号">手機號碼 <span class="required" id="phoneReq">*</span></label>
        <div style="display: flex; gap: 6px; align-items: center;">
            
            <!-- 👇 自訂國碼下拉選單 👇 -->
            <div class="custom-select-wrapper" id="countryCodeWrapper" style="flex-shrink: 0;">
                <div class="custom-select-trigger" id="countryCodeTrigger">
                    <span id="selectedCountryCode">+886</span>
                    <span class="arrow">▼</span>
                </div>
                <div class="custom-options" id="countryCodeOptions">
                    <div class="custom-option" data-value="+886" onclick="selectCountry('+886')">+886 (TW)</div>
                    <div class="custom-option" data-value="+81" onclick="selectCountry('+81')">+81 (JP)</div>
                    <div class="custom-option" data-value="+86" onclick="selectCountry('+86')">+86 (CN)</div>
                    <div class="custom-option" data-value="+1" onclick="selectCountry('+1')">+1 (US)</div>
                    <div class="custom-option" data-value="+44" onclick="selectCountry('+44')">+44 (UK)</div>
                    <div class="custom-option" data-value="+61" onclick="selectCountry('+61')">+61 (AU)</div>
                    <div class="custom-option" data-value="+82" onclick="selectCountry('+82')">+82 (KR)</div>
                    <div class="custom-option" data-value="+852" onclick="selectCountry('+852')">+852 (HK)</div>
                    <div class="custom-option" data-value="+65" onclick="selectCountry('+65')">+65 (SG)</div>
                </div>
            </div>
            <!-- 👆 自訂國碼下拉選單結束 👆 -->

            <input type="tel" id="shipPhone" placeholder="例如 0912345678" style="flex: 1; min-width: 0;" data-zh-placeholder="例如 0912345678" data-cn-placeholder="例如 0912345678" data-en-placeholder="e.g. 0912345678" data-ja-placeholder="例：0912345678">
            <button type="button" id="btnNoPhone" class="btn btn-outline" style="padding: 0 16px; border-radius: 12px; font-size: 0.85rem; white-space: nowrap; flex-shrink: 0; border: 1.5px solid #cbdae8; transition: all 0.3s;">無需提供</button>
        </div>
    </div>
    <div class="form-row" style="flex: 1;">
        <label data-zh="郵遞區號" data-cn="邮编" data-en="Zip Code" data-ja="郵便番号">郵遞區號 <span class="required">*</span></label>
        <input type="text" id="shipZip" placeholder="例如 100" maxlength="6" data-zh-placeholder="例如 100" data-cn-placeholder="例如 100" data-en-placeholder="e.g. 100" data-ja-placeholder="例：100">
    </div>
</div>
