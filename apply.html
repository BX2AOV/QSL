<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的申請 - BX2AOV QSL confirm</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="apply.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="app-container">
        <header class="header-bar">
            <div class="logo-area">
                <span class="logo-icon">📡</span>
                <span>BX2AOV QSL confirm</span>
                <span class="callsign-badge">BX2AOV</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-tab" data-zh="總覽" data-cn="总览" data-en="Overview" data-ja="概要">總覽</a></li>
                <li><a href="apply.html" class="nav-tab active" data-zh="我的申請" data-cn="我的申请" data-en="My Requests" data-ja="申請履歴">我的申請</a></li>
                <li><a href="manage.html" class="nav-tab" data-zh="管理員" data-cn="管理员" data-en="Admin" data-ja="管理者">管理員</a></li>
            </ul>
            
            <div style="display: flex; align-items: center; gap: 12px;">
                <div class="lang-switch" id="langToggle" title="Switch Language">
                    <div class="lang-slider" id="langSlider"></div>
                    <span class="lang-option" data-lang="zh" onclick="changeLang('zh')">繁</span>
                    <span class="lang-option" data-lang="cn" onclick="changeLang('cn')">简</span>
                    <span class="lang-option" data-lang="en" onclick="changeLang('en')">EN</span>
                    <span class="lang-option" data-lang="ja" onclick="changeLang('ja')">日</span>
                </div>

                <div id="loginStatus" style="font-size:0.9rem; color:#2b4056;">
                    <span class="role-badge" data-zh="訪客" data-cn="访客" data-en="Guest" data-ja="ゲスト">訪客</span>
                </div>
            </div>
        </header>

        <section class="card">
            <h2 data-zh="🔍 查詢我的通聯紀錄" data-cn="🔍 查询我的通联记录" data-en="🔍 Search My QSO Logs" data-ja="🔍 交信記録を検索">🔍 查詢我的通聯紀錄</h2>
            <div class="card-sub" data-zh="輸入您的呼號，系統會自動找出資料庫中屬於您的通聯紀錄。" data-cn="输入您的呼号，系统会自动找出数据库中属于您的通联记录。" data-en="Enter your callsign to find your QSO logs." data-ja="コールサインを入力すると、データベースからあなたの交信記録を検索します。">輸入您的呼號，系統會自動找出資料庫中屬於您的通聯紀錄。</div>
            <div class="user-callsign-area">
                <input type="text" id="queryCallsignInput" placeholder="輸入您的呼號" style="text-transform:uppercase;" data-zh-placeholder="輸入您的呼號" data-cn-placeholder="输入您的呼号" data-en-placeholder="Enter Callsign" data-ja-placeholder="コールサインを入力">
                <button class="btn btn-primary" id="btnQuery" data-zh="查詢通聯紀錄" data-cn="查询通联记录" data-en="Search Logs" data-ja="検索する">查詢通聯紀錄</button>
                <span id="queryResultHint" style="font-size:0.9rem; color:#5a6e85;"></span>
            </div>
        </section>

        <section class="card" id="queryResultCard" style="display:none;">
            <h2 data-zh="📋 您的通聯紀錄" data-cn="📋 您的通联记录" data-en="📋 Your QSO Logs" data-ja="📋 あなたの交信記録">📋 您的通聯紀錄</h2>
            <div class="card-sub" data-zh="以下是資料庫中屬於您呼號的通聯紀錄。勾選您要申請 QSL 換卡的通聯（可多選）。" data-cn="以下是数据库中属于您呼号的通联记录。勾选您要申请 QSL 换卡的通联（可多选）。" data-en="Select the QSOs you want to request a QSL card for (multiple allowed)." data-ja="QSLカードを請求する交信を選択してください（複数選択可）。">以下是資料庫中屬於您呼號的通聯紀錄。勾選您要申請 QSL 換卡的通聯（可多選）。</div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th style="width:40px;"><input type="checkbox" id="selectAll" title="全選"></th>
                            <th data-zh="日期" data-cn="日期" data-en="Date" data-ja="日付">日期</th>
                            <th data-zh="呼號" data-cn="呼号" data-en="Callsign" data-ja="コールサイン">呼號</th>
                            <th data-zh="頻段" data-cn="频段" data-en="Band" data-ja="バンド">頻段</th>
                            <th data-zh="模式" data-cn="模式" data-en="Mode" data-ja="モード">模式</th>
                            <th data-zh="QSL 狀態" data-cn="QSL 状态" data-en="QSL Status" data-ja="QSL ステータス">QSL 狀態</th>
                            <th data-zh="備註" data-cn="备注" data-en="Notes" data-ja="備考">備註</th>
                        </tr>
                    </thead>
                    <tbody id="queryResultBody"></tbody>
                </table>
            </div>
        </section>

        <section class="card" id="shipInfoCard" style="display:none;">
            <h2 data-zh="📮 收件資訊" data-cn="📮 收件信息" data-en="📮 Shipping Info" data-ja="📮 発送先情報">📮 收件資訊</h2>
            <div class="card-sub" data-zh="請填寫您的收件資訊，以便寄送 QSL 卡。" data-cn="请填写您的收件信息，以便寄送 QSL 卡。" data-en="Please fill in your shipping information." data-ja="QSLカード発送のため、発送先情報を入力してください。">請填寫您的收件資訊，以便寄送 QSL 卡。</div>
            
            <div class="ship-form">
                <div class="form-row">
                    <label data-zh="收件人" data-cn="收件人" data-en="Recipient" data-ja="受取人">收件人 <span class="required">*</span></label>
                    <input type="text" id="shipName" placeholder="請輸入收件人姓名" data-zh-placeholder="請輸入收件人姓名" data-cn-placeholder="请输入收件人姓名" data-en-placeholder="Full Name" data-ja-placeholder="氏名を入力">
                </div>
                
                <!-- 手機與郵遞區號並排區塊 -->
                <div class="row-group">
                    <div class="form-row" style="flex: 2;">
                        <label data-zh="手機號碼" data-cn="手机号码" data-en="Phone" data-ja="電話番号">手機號碼 <span class="required" id="phoneReq">*</span></label>
                        <div style="display: flex; gap: 6px;">
                            <!-- 國碼下拉選單 -->
                            <select id="shipCountryCode" style="width: 100px; padding: 12px; border-radius: 12px; border: 1.5px solid #cbdae8; background: #f8fbfe; font-family: inherit; font-size: 1rem; outline: none;">
                                <option value="+886">+886 (TW)</option>
                                <option value="+81">+81 (JP)</option>
                                <option value="+86">+86 (CN)</option>
                                <option value="+1">+1 (US)</option>
                                <option value="+44">+44 (UK)</option>
                                <option value="+61">+61 (AU)</option>
                                <option value="+82">+82 (KR)</option>
                                <option value="+852">+852 (HK)</option>
                                <option value="+65">+65 (SG)</option>
                            </select>
                            <!-- 手機輸入框 -->
                            <input type="tel" id="shipPhone" placeholder="例如 0912345678" style="flex: 1;" data-zh-placeholder="例如 0912345678" data-cn-placeholder="例如 0912345678" data-en-placeholder="e.g. 0912345678" data-ja-placeholder="例：0912345678">
                            <!-- 無需提供按鈕 -->
                            <button type="button" id="btnNoPhone" class="btn btn-outline" style="padding: 0 16px; border-radius: 12px; font-size: 0.85rem; white-space: nowrap; border: 1.5px solid #cbdae8;">無需提供</button>
                        </div>
                    </div>
                    <div class="form-row" style="flex: 1;">
                        <label data-zh="郵遞區號" data-cn="邮编" data-en="Zip Code" data-ja="郵便番号">郵遞區號 <span class="required">*</span></label>
                        <input type="text" id="shipZip" placeholder="例如 100" maxlength="6" data-zh-placeholder="例如 100" data-cn-placeholder="例如 100" data-en-placeholder="e.g. 100" data-ja-placeholder="例：100">
                    </div>
                </div>

                <div class="form-row">
                    <label data-zh="地址" data-cn="地址" data-en="Address" data-ja="住所">地址 <span class="required">*</span></label>
                    <input type="text" id="shipAddress" placeholder="例如 台北市中正區重慶南路一段122號" data-zh-placeholder="例如 台北市中正區重慶南路一段122號" data-cn-placeholder="例如 台北市中正区重庆南路一段122号" data-en-placeholder="e.g. No. 122, Sec. 1, Chongqing S. Rd., Zhongzheng Dist., Taipei City" data-ja-placeholder="例：台北市中正区重慶南路一段122号">
                </div>
                
                <div class="form-row">
                    <label data-zh="備註" data-cn="备注" data-en="Notes" data-ja="備考">備註</label>
                    <input type="text" id="shipNote" placeholder="選填，例如指定寄送方式" data-zh-placeholder="選填，例如指定寄送方式" data-cn-placeholder="选填，例如指定寄送方式" data-en-placeholder="Optional, e.g. shipping method" data-ja-placeholder="任意（発送方法など）">
                </div>
            </div>
            <div style="margin-top:24px; display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
                <button class="btn btn-primary" id="btnSubmitApplication" data-zh="送出 QSL 換卡申請" data-cn="提交 QSL 换卡申请" data-en="Submit QSL Request" data-ja="QSL申請を送信">送出 QSL 換卡申請</button>
                <span id="selectedCountHint" style="font-size:0.85rem; color:#7e96af;"></span>
            </div>
        </section>

        <section class="card">
            <h2 data-zh="📬 我的申請紀錄" data-cn="📬 我的申请记录" data-en="📬 My Request History" data-ja="📬 申請履歴">📬 我的申請紀錄</h2>
            <div class="card-sub" data-zh="以下為您已送出的 QSL 換卡申請。" data-cn="以下为您已送出的 QSL 换卡申请。" data-en="History of your submitted QSL requests." data-ja="送信済みのQSL申請履歴です。">以下為您已送出的 QSL 換卡申請。</div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th data-zh="申請日期" data-cn="申请日期" data-en="Req Date" data-ja="申請日">申請日期</th>
                            <th data-zh="通聯呼號" data-cn="通联呼号" data-en="Callsign" data-ja="コールサイン">通聯呼號</th>
                            <th data-zh="通聯日期" data-cn="通联日期" data-en="QSO Date" data-ja="交信日">通聯日期</th>
                            <th data-zh="頻段/模式" data-cn="频段/模式" data-en="Band / Mode" data-ja="バンド/モード">頻段/模式</th>
                            <th data-zh="收件人" data-cn="收件人" data-en="Recipient" data-ja="受取人">收件人</th>
                            <th data-zh="手機" data-cn="手机" data-en="Phone" data-ja="電話番号">手機</th>
                            <th data-zh="地址" data-cn="地址" data-en="Address" data-ja="住所">地址</th>
                            <th data-zh="申請狀態" data-cn="申请状态" data-en="Status" data-ja="ステータス">申請狀態</th>
                        </tr>
                    </thead>
                    <tbody id="myRequestsBody"></tbody>
                </table>
            </div>
        </section>
    </div>

    <div class="lightbox" id="lightbox">
        <span class="lightbox-close" id="lightboxClose">×</span>
        <img id="lightboxImg" src="" alt="QSL 卡大圖">
    </div>

    <div id="toast" class="toast">操作成功</div>

    <script src="apply.js"></script>
</body>
</html>
