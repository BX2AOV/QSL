<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的申請 — BX2AOV QSL confirm</title>
    <meta name="description" content="用呼號查詢你的通聯紀錄，線上送出 QSL 換卡申請並追蹤處理狀態。資料即時同步，免註冊。">
    <meta name="author" content="BX2AOV">
    <meta name="theme-color" content="#0b2a4a">
    <meta name="color-scheme" content="light dark">
    <meta name="format-detection" content="telephone=no">
    <link rel="canonical" href="https://qsl-web.pages.dev/apply">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="favicon.svg">
    <link rel="preconnect" href="https://btcsstbtbnejuyexwbpn.supabase.co" crossorigin>
    <link rel="dns-prefetch" href="https://btcsstbtbnejuyexwbpn.supabase.co">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="BX2AOV QSL confirm">
    <meta property="og:locale" content="zh_TW">
    <meta property="og:title" content="我的申請 — BX2AOV QSL confirm">
    <meta property="og:description" content="用呼號查詢通聯紀錄，線上送出 QSL 換卡申請並追蹤處理狀態。">
    <meta property="og:url" content="https://qsl-web.pages.dev/apply">
    <meta property="og:image" content="https://btcsstbtbnejuyexwbpn.supabase.co/storage/v1/object/public/qsl-images/1793273956318_21_sent.jpg">
    <meta name="twitter:card" content="summary_large_image">

    <script src="js/theme.js?v=20261031h"></script>
    <link rel="stylesheet" href="css/style.css?v=20261031h">
    <link rel="stylesheet" href="css/apply.css?v=20261031h">
    <script src="js/api.js?v=20261031h" defer></script>
</head>
<body>
    <a class="skip-link" href="#main">跳到主要內容</a>
    <div class="app-container">
        <header class="header-bar">
            <div class="logo-area">
                <span class="logo-icon" aria-hidden="true">📡</span>
                <span>BX2AOV QSL confirm</span>
                <span class="callsign-badge">BX2AOV</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-tab" data-zh="總覽" data-cn="总览" data-en="Overview" data-ja="概要">總覽</a></li>
                <li><a href="apply.html" class="nav-tab active" aria-current="page" data-zh="我的申請" data-cn="我的申请" data-en="My Requests" data-ja="申請履歴">我的申請</a></li>
                <li><a href="manage.html" class="nav-tab" data-zh="管理員" data-cn="管理员" data-en="Admin" data-ja="管理者">管理員</a></li>
            </ul>
            
            <div style="display: flex; align-items: center; gap: 12px;">
                <button type="button" id="themeToggle" class="theme-toggle" aria-label="主題">🌗</button>
                <div class="lang-switch" id="langToggle" title="Switch Language" role="radiogroup" aria-label="語言切換">
                    <div class="lang-slider" id="langSlider" aria-hidden="true"></div>
                    <span class="lang-option" data-lang="zh">繁</span>
                    <span class="lang-option" data-lang="cn">简</span>
                    <span class="lang-option" data-lang="en">EN</span>
                    <span class="lang-option" data-lang="ja">日</span>
                </div>
                <div id="loginStatus" style="font-size:0.9rem; color:#2b4056;">
                    <span class="role-badge" data-zh="訪客" data-cn="访客" data-en="Guest" data-ja="ゲスト">訪客</span>
                </div>
            </div>
        </header>

        <main id="main">
        <section class="card">
            <h2 data-zh="🔍 查詢我的通聯紀錄" data-cn="🔍 查询我的通联记录" data-en="🔍 Search My QSO Logs" data-ja="🔍 交信記録の検索">🔍 查詢我的通聯紀錄</h2>
            <div class="card-sub" data-zh="輸入您的呼號，系統會自動找出資料庫中屬於您的通聯紀錄。" data-cn="输入您的呼号，系统会自动找出数据库中属于您的通联记录。" data-en="Enter your callsign to find your QSO records." data-ja="コールサインを入力すると、ご自身の交信記録が検索されます。">輸入您的呼號，系統會自動找出資料庫中屬於您的通聯紀錄。</div>
            
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <label class="sr-only" for="queryCallsignInput">您的呼號</label>
                <input type="text" id="queryCallsignInput" placeholder="請輸入呼號 (例: BV2AAA)" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="15" style="flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #cbdae8; text-transform: uppercase; min-width: 0;">
                <button id="btnQuery" class="btn-primary" style="padding: 0 24px; border-radius: 8px; border: none; background: #0b2a4a; color: #fff; font-weight: bold; cursor: pointer; height: 46px; white-space: nowrap;" data-zh="查詢通聯紀錄" data-cn="查询通联记录" data-en="Search" data-ja="検索">查詢通聯紀錄</button>
            </div>
            <div id="queryResultHint" style="margin-top: 10px; font-weight: bold;" role="status" aria-live="polite"></div>
        </section>

        <!-- 查詢結果表格 -->
        <section class="card" id="queryResultCard" style="display: none;">
            <div class="flex-between">
                <h3 data-zh="📋 您的通聯紀錄" data-cn="📋 您的通联记录" data-en="📋 Your QSO Logs" data-ja="📋 あなたの交信記録">📋 您的通聯紀錄</h3>
                <div class="card-sub" style="margin-bottom:0;" data-zh="勾選您要申請 QSL 換卡的通聯。" data-cn="勾选您要申请 QSL 换卡的通联。" data-en="Select the QSOs you want to request QSL for." data-ja="QSLカードを請求する交信を選択してください。">勾選您要申請 QSL 換卡的通聯。</div>
            </div>
            
            <div class="table-wrapper" style="margin-top: 15px;">
                <table>
                    <caption class="sr-only">查詢結果：您的通聯紀錄</caption>
                    <thead>
                        <tr>
                            <th scope="col" style="width: 50px; text-align: center;"><input type="checkbox" id="selectAll" aria-label="全選"></th>
                            <th scope="col" data-zh="日期" data-cn="日期" data-en="Date" data-ja="日付">日期</th>
                            <th scope="col" data-zh="呼號" data-cn="呼号" data-en="Callsign" data-ja="コールサイン">呼號</th>
                            <th scope="col" data-zh="頻段" data-cn="频段" data-en="Band" data-ja="バンド">頻段</th>
                            <th scope="col" data-zh="模式" data-cn="模式" data-en="Mode" data-ja="モード">模式</th>
                            <th scope="col" data-zh="QSL 狀態" data-cn="QSL 状态" data-en="QSL Status" data-ja="QSLステータス">QSL 狀態</th>
                            <th scope="col" data-zh="備註" data-cn="备注" data-en="Notes" data-ja="備考">備註</th>
                        </tr>
                    </thead>
                    <tbody id="queryResultBody"></tbody>
                </table>
            </div>
        </section>

        <!-- 填寫收件資訊與密碼 -->
        <section class="card" id="shipInfoCard" style="display: none;">
            <h3 data-zh="✉️ 填寫收件資訊" data-cn="✉️ 填写收件信息" data-en="✉️ Shipping Info" data-ja="✉️ 送付先情報">✉️ 填寫收件資訊</h3>
            <div id="selectedCountHint" style="margin: 10px 0; color: #7b3fa0; font-weight: bold;"></div>
            
            <div class="ship-grid">
                <div>
                    <label for="shipName" data-zh="收件人姓名 *" data-cn="收件人姓名 *" data-en="Name *" data-ja="氏名 *">收件人姓名 *</label>
                    <input type="text" id="shipName" autocomplete="name" maxlength="100" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #cbdae8;">
                </div>
                <div>
                    <label for="shipPhone" data-zh="手機號碼" data-cn="手机号码" data-en="Phone" data-ja="電話番号">手機號碼</label>
                    <div style="display: flex; gap: 5px;">
                        <label class="sr-only" for="countryCode">國碼</label>
                        <select id="countryCode" autocomplete="tel-country-code" aria-label="國碼"
                                style="padding: 10px; border-radius: 8px; border: 1px solid #cbdae8; background: #fff; cursor: pointer; max-width: 128px;">
                            <option value="+886" selected>+886 台灣</option>
                            <option value="+852">+852 香港</option>
                            <option value="+853">+853 澳門</option>
                            <option value="+86">+86 中國</option>
                            <option value="+81">+81 日本</option>
                            <option value="+82">+82 韓國</option>
                            <option value="+65">+65 新加坡</option>
                            <option value="+60">+60 馬來西亞</option>
                            <option value="+66">+66 泰國</option>
                            <option value="+84">+84 越南</option>
                            <option value="+63">+63 菲律賓</option>
                            <option value="+62">+62 印尼</option>
                            <option value="+91">+91 印度</option>
                            <option value="+61">+61 澳洲</option>
                            <option value="+64">+64 紐西蘭</option>
                            <option value="+1">+1 美加</option>
                            <option value="+44">+44 英國</option>
                            <option value="+49">+49 德國</option>
                            <option value="+33">+33 法國</option>
                            <option value="+39">+39 義大利</option>
                            <option value="+34">+34 西班牙</option>
                            <option value="+31">+31 荷蘭</option>
                            <option value="+7">+7 俄羅斯</option>
                            <option value="+55">+55 巴西</option>
                            <option value="+27">+27 南非</option>
                        </select>
                        <input type="tel" id="shipPhone" autocomplete="tel-national" inputmode="tel" maxlength="20" placeholder="912345678" style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #cbdae8; min-width: 0;">
                        <button type="button" id="btnNoPhone" aria-pressed="false" style="padding: 0 10px; border-radius: 8px; border: 1px solid #cbdae8; background: #fff; cursor: pointer; white-space: nowrap;">無需提供</button>
                    </div>
                </div>
                <div>
                    <label for="shipZip" data-zh="郵遞區號 *" data-cn="邮政编码 *" data-en="Zip Code *" data-ja="郵便番号 *">郵遞區號 *</label>
                    <input type="text" id="shipZip" autocomplete="postal-code" maxlength="20" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #cbdae8;">
                </div>
                <div class="span-2">
                    <label for="shipAddress" data-zh="收件地址 *" data-cn="收件地址 *" data-en="Address *" data-ja="住所 *">收件地址 *</label>
                    <input type="text" id="shipAddress" autocomplete="street-address" maxlength="500" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #cbdae8;">
                </div>
                <div class="span-2">
                    <label for="shipNote" data-zh="備註 (選填)" data-cn="备注 (选填)" data-en="Note (Optional)" data-ja="備考 (任意)">備註 (選填)</label>
                    <input type="text" id="shipNote" maxlength="500" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #cbdae8;">
                </div>
            </div>

            <button id="btnSubmitApplication" class="btn-primary" style="width: 100%; margin-top: 20px; padding: 15px; font-size: 1.1rem;" data-zh="送出 QSL 換卡申請" data-cn="提交 QSL 换卡申请" data-en="Submit QSL Request" data-ja="QSLカード申請を送信">送出 QSL 換卡申請</button>
        </section>

        <!-- 我的申請紀錄 -->
        <section class="card">
            <h3 data-zh="📬 我的申請紀錄" data-cn="📬 我的申请记录" data-en="📬 My Requests" data-ja="📬 申請履歴">📬 我的申請紀錄</h3>
            <div class="card-sub" data-zh="以下為您已送出的 QSL 換卡申請。" data-cn="以下为您已送出的 QSL 换卡申请。" data-en="Below are your submitted QSL requests." data-ja="以下は送信済みのQSLカード申請です。">以下為您已送出的 QSL 換卡申請。</div>
            
            <div class="table-wrapper" style="margin-top: 15px;">
                <table>
                    <caption class="sr-only">我的申請紀錄</caption>
                    <thead>
                        <tr>
                            <th scope="col" data-zh="申請日期" data-cn="申请日期" data-en="Req Date" data-ja="申請日">申請日期</th>
                            <th scope="col" data-zh="通聯呼號" data-cn="通联呼号" data-en="QSO Call" data-ja="交信コールサイン">通聯呼號</th>
                            <th scope="col" data-zh="通聯日期" data-cn="通联日期" data-en="QSO Date" data-ja="交信日">通聯日期</th>
                            <th scope="col" data-zh="頻段/模式" data-cn="频段/模式" data-en="Band/Mode" data-ja="バンド/モード">頻段/模式</th>
                            <th scope="col" data-zh="申請狀態" data-cn="申请状态" data-en="Status" data-ja="ステータス">申請狀態</th>
                        </tr>
                    </thead>
                    <tbody id="myRequestsBody"></tbody>
                </table>
            </div>
        </section>
        </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite">操作成功</div>

    <!-- Cloudflare Web Analytics：到 Dashboard 取得 token 後，把下面兩行的註解拿掉並填入 token
    <script defer src="https://static.cloudflareinsights.com/beacon.min.js"
            data-cf-beacon='{"token": "在這裡貼上你的 token"}'></script>
    -->
    <script src="js/apply.js?v=20261031h" defer></script>
</body>
</html>
