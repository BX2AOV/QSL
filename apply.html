<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的申請 - BX2AOV QSL confirm</title>
    <!-- 引入共用的 style.css -->
    <link rel="stylesheet" href="style.css">
    <!-- 引入 apply.html 專用的 apply.css -->
    <link rel="stylesheet" href="apply.css">
</head>
<body>
    <div class="app-container">
        <!-- 頂部橫列 -->
        <header class="header-bar">
            <div class="logo-area">
                <span class="logo-icon">📡</span>
                <span>BX2AOV QSL confirm</span>
                <span class="callsign-badge">BX2AOV</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-tab">總覽</a></li>
                <li><a href="apply.html" class="nav-tab active">我的申請</a></li>
                <li><a href="index.html#admin-panel" class="nav-tab">管理員</a></li>
            </ul>
            <div id="loginStatus" style="font-size:0.9rem; color:#2b4056;">
                <span class="role-badge">訪客</span>
            </div>
        </header>

        <!-- 步驟 1：輸入呼號查詢 -->
        <section class="card">
            <h2>🔍 查詢我的通聯紀錄</h2>
            <div class="card-sub">輸入您的呼號，系統會自動找出資料庫中屬於您的通聯紀錄。</div>
            <div class="user-callsign-area">
                <input type="text" id="queryCallsignInput" placeholder="輸入您的呼號" style="text-transform:uppercase;">
                <button class="btn btn-primary" id="btnQuery">查詢通聯紀錄</button>
                <span id="queryResultHint" style="font-size:0.9rem; color:#5a6e85;"></span>
            </div>
        </section>

        <!-- 步驟 2：查詢結果 -->
        <section class="card" id="queryResultCard" style="display:none;">
            <h2>📋 您的通聯紀錄</h2>
            <div class="card-sub">以下是資料庫中屬於您呼號的通聯紀錄。勾選您要申請 QSL 換卡的通聯（可多選）。</div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th style="width:40px;"><input type="checkbox" id="selectAll" title="全選"></th>
                            <th>日期</th><th>呼號</th><th>頻段</th><th>模式</th><th>QSL 狀態</th><th>備註</th>
                        </tr>
                    </thead>
                    <tbody id="queryResultBody"></tbody>
                </table>
            </div>
        </section>

        <!-- 步驟 3：填寫收件資訊 -->
        <section class="card" id="shipInfoCard" style="display:none;">
            <h2>📮 收件資訊</h2>
            <div class="card-sub">請填寫您的收件資訊，以便寄送 QSL 卡。</div>
            <div class="ship-form">
                <div class="form-row">
                    <label>收件人 <span class="required">*</span></label>
                    <input type="text" id="shipName" placeholder="請輸入收件人姓名">
                </div>
                
                <!-- 使用 row-group 讓這兩個並排 -->
                <div class="row-group">
                    <div class="form-row">
                        <label>手機號碼 <span class="required">*</span></label>
                        <input type="tel" id="shipPhone" placeholder="例如 0912345678">
                    </div>
                    <div class="form-row">
                        <label>郵遞區號 <span class="required">*</span></label>
                        <input type="text" id="shipZip" placeholder="例如 100" maxlength="6">
                    </div>
                </div>

                <div class="form-row">
                    <label>地址 <span class="required">*</span></label>
                    <input type="text" id="shipAddress" placeholder="例如 台北市中正區重慶南路一段122號">
                </div>
                
                <div class="form-row">
                    <label>備註</label>
                    <input type="text" id="shipNote" placeholder="選填，例如指定寄送方式">
                </div>
            </div>
            <div style="margin-top:24px; display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
                <button class="btn btn-primary" id="btnSubmitApplication">送出 QSL 換卡申請</button>
                <span id="selectedCountHint" style="font-size:0.85rem; color:#7e96af;"></span>
            </div>
        </section>

        <!-- 已送出的申請紀錄 -->
        <section class="card">
            <h2>📬 我的申請紀錄</h2>
            <div class="card-sub">以下為您已送出的 QSL 換卡申請。</div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>申請日期</th><th>通聯呼號</th><th>通聯日期</th><th>頻段/模式</th>
                            <th>收件人</th><th>手機</th><th>地址</th><th>申請狀態</th>
                        </tr>
                    </thead>
                    <tbody id="myRequestsBody">
                        <tr><td colspan="8"><div class="empty-state">尚無申請紀錄</div></td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- 燈箱 (點擊圖片放大) -->
    <div class="lightbox" id="lightbox">
        <span class="lightbox-close" id="lightboxClose">×</span>
        <img id="lightboxImg" src="" alt="QSL 卡大圖">
    </div>

    <!-- 提示訊息 Toast -->
    <div id="toast" class="toast">操作成功</div>

    <!-- 只載入 apply.js，不依賴 script.js -->
    <script src="apply.js"></script>
</body>
</html>
